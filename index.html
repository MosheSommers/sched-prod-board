<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <p data-testid="loader" class="note" role="status">Loading incidents…</p>
      <p data-testid="error" class="note error" role="alert" hidden></p>
      <ul data-testid="incident-list" class="list" hidden></ul>
    </main>
    <dialog data-testid="confirm" class="confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-testid="confirm-title"></h2>
      <p class="detail" data-testid="confirm-detail"></p>
      <div class="buttons">
        <button type="button" class="cancel" data-testid="confirm-cancel">Cancel</button>
        <button type="button" class="ack" data-testid="confirm-ack">Ack</button>
      </div>
    </dialog>
    <footer>sched-prod incident board · build <span data-testid="build-sha">bc2cbc2f5d5c9b2f48a28ea002f59dfd855bb5f9</span></footer>
  </body>
